<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bhop Arena — Source-style movement</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; font-family: 'Segoe UI', system-ui, sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute; inset: 0; pointer-events: none;
      color: #e8e8f0; text-shadow: 0 1px 3px #000;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
      background: #fff; border-radius: 50%; transform: translate(-50%, -50%);
      box-shadow: 0 0 0 1px #0008;
    }
    #hud {
      position: absolute; bottom: 24px; left: 24px;
      font-size: 14px; line-height: 1.5; opacity: 0.9;
    }
    #hud .speed { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    #hud .speed.fast { color: #7dffb3; }
    #hud .speed.veryfast { color: #ffd166; }
    #hud .speed.insane { color: #ff6b6b; }
    #menu {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #0a0a0fcc;
      pointer-events: auto; transition: opacity 0.3s;
    }
    #menu.hidden { opacity: 0; pointer-events: none; }
    #menu h1 {
      font-size: 42px; font-weight: 800; letter-spacing: -1px;
      background: linear-gradient(135deg, #7dffb3, #5b8def);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    #menu p { color: #aaa; margin-bottom: 28px; max-width: 420px; text-align: center; line-height: 1.5; }
    .btn {
      background: #1a1a24; border: 1px solid #333; color: #eee;
      padding: 12px 28px; font-size: 16px; border-radius: 8px;
      cursor: pointer; margin: 6px; transition: all 0.15s;
    }
    .btn:hover { background: #252532; border-color: #7dffb3; color: #7dffb3; }
    .btn.primary { background: #1e3a2f; border-color: #7dffb3; color: #7dffb3; }
    #room-input {
      background: #12121a; border: 1px solid #333; color: #eee;
      padding: 10px 16px; font-size: 15px; border-radius: 6px;
      width: 180px; text-align: center; margin: 8px;
    }
    #status {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      font-size: 13px; color: #aaa; background: #0006; padding: 6px 14px; border-radius: 20px;
    }
    #controls-hint {
      position: absolute; top: 16px; right: 16px; font-size: 12px;
      color: #666; text-align: right; line-height: 1.6;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="crosshair"></div>
    <div id="status">Click to play</div>
    <div id="controls-hint">
      WASD move · Space jump / bhop<br>
      Ctrl / C slide · Shift walk<br>
      Mouse look · Esc unlock
    </div>
    <div id="hud">
      <div class="speed" id="speed">0</div>
      <div id="info">u/s</div>
    </div>
  </div>

  <div id="menu">
    <h1>BHOP ARENA</h1>
    <p>Source-style movement · air strafe · perfect bhop · slide<br>
       Pure client-side · works on GitHub Pages</p>
    <button class="btn primary" id="btn-solo">Play Solo</button>
    <div style="margin-top:18px; display:flex; align-items:center; gap:8px;">
      <input id="room-input" placeholder="room code" maxlength="8" />
      <button class="btn" id="btn-join">Join / Host</button>
    </div>
    <p style="margin-top:20px; font-size:13px; color:#666;">
      Multiplayer uses PeerJS (public free server).<br>
      Share the same room code with friends.
    </p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
