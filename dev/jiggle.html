<!doctype html><html><head><meta charset="utf-8"><title>Jiggle test</title>
<style>
body{margin:0;background:#1d2230;overflow:hidden;font:13px system-ui,sans-serif;color:#eee}
#ui{position:fixed;top:10px;left:10px;display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.45);padding:10px 12px;border-radius:8px}
#ui button{background:#f2c45a;color:#222;border:0;border-radius:5px;padding:6px 10px;font-weight:700;cursor:pointer}
#ui label{display:flex;gap:8px;align-items:center}
#read{font:12px monospace;opacity:.85}
</style></head>
<body><div id="ui">
  <b>Inkweaver — chest secondary motion</b>
  <div><button id="jump">Jump</button> <button id="dbl">Double jump</button> <button id="loop">Auto-jump: on</button></div>
  <label><input type="checkbox" id="on" checked> jiggle enabled</label>
  <label>strength <input type="range" id="str" min="0" max="2" step="0.05" value="1"><span id="sv">1.00</span></label>
  <label>speed <input type="range" id="slow" min="0.1" max="1" step="0.05" value="1"><span id="slv">1.00</span>×</label>
  <div id="read"></div>
  <div style="opacity:.7">drag to orbit · scroll to zoom</div>
</div><script type="module" src="./jiggle.js"></script></body></html>
